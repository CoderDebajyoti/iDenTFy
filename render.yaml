services:
  # ============================================================================
  # 1. FastAPI Screening Engine Web Service
  # ============================================================================
  - type: web
    name: identfy-backend
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: identfy-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://identfy-frontend.onrender.com
      - key: DATABASE_MATCHING_ENABLED
        value: "false"
      - key: FACE_SIMILARITY_THRESHOLD
        value: "0.68"
      - key: ENV
        value: "production"
      - key: DEBUG
        value: "false"

  # ============================================================================
  # 2. React / Vite Frontend Static Site
  # ============================================================================
  - type: web
    name: identfy-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://identfy-backend.onrender.com

databases:
  # ============================================================================
  # 3. Production Managed PostgreSQL Database
  # ============================================================================
  - name: identfy-postgres
    plan: starter
    region: oregon
    databaseName: identfy_db
    user: identfy_user
